# ⚠️  TEMPLATE ONLY — THE VALUES BELOW ARE PLACEHOLDERS. DO NOT COMMIT REAL ONES.
#
# A Kubernetes Secret is base64-encoded, not encrypted. Anyone who can read the
# object can read the value, and by default it is also stored unencrypted in
# etcd. Committing a real secret to git is worse still: it is then in every
# clone and every fork, forever, and rotating it does not un-publish it.
#
# In real use, create the Secret imperatively so the values never touch a file:
#
#   kubectl -n trpctodo create secret generic trpctodo-secrets \
#     --from-literal=DATABASE_URL='postgresql://trpctodo:REAL_PASSWORD@postgres:5432/trpctodo?schema=public' \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-...' \
#     --from-literal=POSTGRES_PASSWORD='REAL_PASSWORD'
#
# (Note `history -d` afterwards, or a leading space, so it stays out of your
# shell history too.)
#
# Better still in production, so that nothing is manual and rotation is
# automatic, pick one of:
#   - GCP Secret Manager + External Secrets Operator, which syncs a real Secret
#     from Secret Manager and re-syncs on rotation
#   - Sealed Secrets, which are safe to commit because only the in-cluster
#     controller holds the decryption key
#   - Workload Identity for anything that supports it (see the note on
#     ANTHROPIC_API_KEY below for why it does not help here)
#
# WHY THIS IS A SECRET AND NOT A CONFIGMAP
#
# Mechanically they are near-identical: both are key/value objects, both can be
# injected as env vars. The difference is the handling they get — RBAC is
# routinely written to allow reading ConfigMaps and deny reading Secrets, Secret
# values are redacted from `kubectl describe`, and encryption-at-rest applies to
# Secrets. Putting a password in a ConfigMap works and quietly opts out of all
# of that.
#
# The rule that follows: if leaking the value would matter, it is a Secret.

apiVersion: v1
kind: Secret
metadata:
  name: trpctodo-secrets
  namespace: trpctodo
type: Opaque

# `stringData` takes plain text and Kubernetes base64-encodes it on write. The
# `data` field would require you to encode by hand — a step that adds no
# security whatsoever and reliably produces "invalid base64" errors.
stringData:
  # Points at the headless Service in postgres-statefulset.yaml. `postgres` on
  # its own resolves inside this namespace; the fully qualified form is
  # postgres.trpctodo.svc.cluster.local.
  #
  # The URL contains the password, which is exactly why the whole string lives
  # here rather than being assembled from a ConfigMap plus a Secret.
  DATABASE_URL: "postgresql://trpctodo:CHANGE_ME@postgres:5432/trpctodo?schema=public"

  # Read by the AI Assistant tab. The other three tabs work without it, so a
  # placeholder here degrades one feature rather than breaking the deployment.
  #
  # Workload Identity cannot replace this one: it federates against Google
  # Cloud APIs, and Anthropic is a third party that authenticates with its own
  # static key. Secret Manager + External Secrets is the realistic path.
  ANTHROPIC_API_KEY: "CHANGE_ME"

  # Consumed by the Postgres container itself to initialise the superuser on
  # first start. It must match the password inside DATABASE_URL above — they
  # are two views of one credential, and a mismatch shows up as the app's pods
  # crash-looping on "password authentication failed" while Postgres itself
  # looks perfectly healthy.
  POSTGRES_PASSWORD: "CHANGE_ME"
